<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LPJ Daily Gold & Silver Rate Poster</title>

<style>
/* =========================================================
   LPJ DAILY RATE POSTER GENERATOR
   HTML + CSS + JAVASCRIPT IN ONE FILE
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #180503;
    color: white;
    min-height: 100vh;
}

/* ---------- HEADER ---------- */

header {
    background: linear-gradient(
        135deg,
        #3b0503,
        #760d07,
        #3b0503
    );

    border-bottom: 2px solid #d5a62a;
    padding: 18px;
    text-align: center;
}

.logo {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 40px;
    font-weight: bold;
    color: #ffe39b;
}

.shop-name {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 21px;
    font-weight: bold;
    color: #ffeab2;
    margin-top: 3px;
}

.subtitle {
    font-size: 11px;
    letter-spacing: 2px;
    color: #e5c76b;
    margin-top: 5px;
}

/* ---------- MAIN ---------- */

.container {
    width: min(1100px, 94%);
    margin: 25px auto;

    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
}

/* ---------- CARDS ---------- */

.card {
    background: #3b0805;
    border: 1px solid #b88929;
    border-radius: 15px;
    padding: 20px;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.5);
}

/* ---------- FORM ---------- */

h2 {
    color: #ffe39b;
    font-family: Georgia, "Times New Roman", serif;
    margin-bottom: 8px;
}

.description {
    color: #d8c18b;
    font-size: 12px;
    margin-bottom: 20px;
    line-height: 1.5;
}

label {
    display: block;
    color: #f2d98d;
    font-size: 13px;
    font-weight: bold;
    margin-top: 13px;
    margin-bottom: 6px;
}

input {
    width: 100%;
    padding: 12px;

    border-radius: 8px;
    border: 1px solid #b88929;

    background: #fff8df;
    color: #351008;

    font-size: 16px;
    font-weight: bold;

    outline: none;
}

input:focus {
    border-color: #ffe39b;

    box-shadow:
        0 0 0 3px rgba(255, 220, 120, 0.15);
}

/* ---------- BUTTONS ---------- */

button {
    width: 100%;

    padding: 13px;
    margin-top: 15px;

    border: none;
    border-radius: 8px;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;
}

.generate {
    background: #e0b43c;
    color: #3b0b05;
}

.download {
    background: #7b160e;
    color: white;
    border: 1px solid #d5a62a;
}

button:hover {
    opacity: 0.9;
}

.watermark {
    text-align: center;
    margin-top: 12px;
    color: #d4b867;
    font-size: 11px;
}

/* ---------- PREVIEW ---------- */

.preview-title {
    display: flex;
    justify-content: space-between;

    color: #ffe39b;
    font-weight: bold;
    font-size: 13px;

    margin-bottom: 10px;
}

.canvas-container {
    background: white;
    border-radius: 10px;
    overflow: hidden;
}

canvas {
    width: 100%;
    height: auto;
    display: block;
}

/* ---------- MOBILE ---------- */

@media (max-width: 800px) {

    .container {
        grid-template-columns: 1fr;
    }

}
</style>
</head>


<body>


<!-- =========================================================
     LPJ HEADER
========================================================= -->

<header>

    <div class="logo">
        LPJ
    </div>

    <div class="shop-name">
        LAKSHMI PRASANNA JEWELLERY
    </div>

    <div class="subtitle">
        DAILY GOLD & SILVER RATE POSTER
    </div>

</header>



<!-- =========================================================
     MAIN APPLICATION
========================================================= -->

<div class="container">


    <!-- =====================================================
         USER INPUT
    ====================================================== -->

    <section class="card">

        <h2>
            LPJ Poster Maker
        </h2>

        <p class="description">
            Enter the date and today's gold and silver rates.
            The day is calculated automatically.
        </p>


        <!-- DATE -->

        <label for="dateInput">
            Date
        </label>

        <input
            id="dateInput"
            type="date"
        >


        <!-- 22K GOLD -->

        <label for="gold22Input">
            Gold 22K — ₹ per gram
        </label>

        <input
            id="gold22Input"
            type="number"
            min="0"
            placeholder="Enter 22K price"
        >


        <!-- 24K GOLD -->

        <label for="gold24Input">
            Gold 24K — ₹ per gram
        </label>

        <input
            id="gold24Input"
            type="number"
            min="0"
            placeholder="Enter 24K price"
        >


        <!-- SILVER -->

        <label for="silverInput">
            Silver — ₹ per gram
        </label>

        <input
            id="silverInput"
            type="number"
            min="0"
            placeholder="Enter Silver price"
        >


        <!-- GENERATE -->

        <button
            class="generate"
            onclick="generatePoster()"
        >
            GENERATE POSTER
        </button>


        <!-- DOWNLOAD -->

        <button
            class="download"
            onclick="downloadPoster()"
        >
            DOWNLOAD PNG
        </button>


        <div class="watermark">
            LPJ • GOLDEN RELATIONS
        </div>

    </section>



    <!-- =====================================================
         POSTER PREVIEW
    ====================================================== -->

    <section class="card">

        <div class="preview-title">

            <span>
                POSTER PREVIEW
            </span>

            <span>
                LPJ
            </span>

        </div>


        <div class="canvas-container">

            <canvas id="posterCanvas"></canvas>

        </div>

    </section>

</div>

/* =========================================================
   HTML ELEMENTS
========================================================= */

const dateInput =
    document.getElementById("dateInput");

const gold22Input =
    document.getElementById("gold22Input");

const gold24Input =
    document.getElementById("gold24Input");

const silverInput =
    document.getElementById("silverInput");

const canvas =
    document.getElementById("posterCanvas");

const ctx =
    canvas.getContext("2d");



/* =========================================================
   DATE CONVERSION
========================================================= */

function convertDateToInput(dateText) {

    const date =
        new Date(dateText);

    const year =
        date.getFullYear();

    const month =
        String(date.getMonth() + 1)
            .padStart(2, "0");

    const day =
        String(date.getDate())
            .padStart(2, "0");

    return `${year}-${month}-${day}`;
}



/* =========================================================
   GET DATE + DAY
========================================================= */

function getDateInformation() {

    const selectedDate =
        new Date(
            dateInput.value + "T00:00:00"
        );

    const days = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
    ];

    return {

        date:
            selectedDate.toLocaleDateString(
                "en-GB",
                {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                }
            ),

        day:
            days[selectedDate.getDay()]

    };
}



/* =========================================================
   FIT PRICE TEXT
========================================================= */

function fitPriceText(
    text,
    maximumWidth,
    startingSize
) {

    let size =
        startingSize;

    while (size > 25) {

        ctx.font =
            `900 ${size}px Arial`;

        if (
            ctx.measureText(text).width
            <= maximumWidth
        ) {
            break;
        }

        size -= 2;
    }

    return size;
}



/* =========================================================
   DRAW PRICE
========================================================= */

function drawPrice(
    text,
    x,
    y,
    color
) {

    const size =
        fitPriceText(
            text,
            330,
            105
        );

    ctx.save();

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.font =
        `900 ${size}px Arial`;

    /* Outline */

    ctx.lineWidth =
        7;

    ctx.strokeStyle =
        "#260402";

    /* Shadow */

    ctx.shadowColor =
        "rgba(0,0,0,.55)";

    ctx.shadowBlur =
        5;

    ctx.shadowOffsetX =
        3;

    ctx.shadowOffsetY =
        4;

    ctx.strokeText(
        text,
        x,
        y
    );

    /* Main text */

    ctx.fillStyle =
        color;

    ctx.fillText(
        text,
        x,
        y
    );

    ctx.restore();
}



/* =========================================================
   COVER ORIGINAL TEXT
========================================================= */

function coverArea(
    x,
    y,
    width,
    height,
    color
) {

    ctx.save();

    ctx.fillStyle =
        color;

    ctx.fillRect(
        x,
        y,
        width,
        height
    );

    ctx.restore();
}



/* =========================================================
   GENERATE POSTER
========================================================= */

function generatePoster() {

    if (
        !posterImage.complete
    ) {
        return;
    }


    /* Canvas uses original image size */

    canvas.width =
        posterImage.naturalWidth;

    canvas.height =
        posterImage.naturalHeight;


    /* Original poster */

    ctx.drawImage(
        posterImage,
        0,
        0
    );


    /* Date */

    const dateInfo =
        getDateInformation();



    /* =====================================================
       DATE
    ====================================================== */

    coverArea(
        108,
        390,
        286,
        104,
        "#fffdf7"
    );


    ctx.save();

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.font =
        "900 29px Arial";

    ctx.fillStyle =
        "#32120b";

    ctx.fillText(
        dateInfo.date,
        251,
        424
    );


    ctx.font =
        "700 23px Arial";

    ctx.fillStyle =
        "#7a1913";

    ctx.fillText(
        "(" + dateInfo.day + ")",
        251,
        462
    );

    ctx.restore();



    /* =====================================================
       GOLD 22K
    ====================================================== */

    coverArea(
        738,
        520,
        414,
        101,
        "#590b06"
    );


    drawPrice(
        gold22Input.value || "____",
        930,
        570,
        "#fff0a5"
    );


    ctx.save();

    ctx.textAlign =
        "right";

    ctx.textBaseline =
        "alphabetic";

    ctx.font =
        "900 34px Arial";

    ctx.fillStyle =
        "#fff1c4";

    ctx.fillText(
        "/1gm",
        1162,
        615
    );

    ctx.restore();



    /* =====================================================
       SILVER
    ====================================================== */

    coverArea(
        738,
        710,
        414,
        101,
        "#0a3e78"
    );


    drawPrice(
        silverInput.value || "____",
        930,
        760,
        "#f5f7fb"
    );


    ctx.save();

    ctx.textAlign =
        "right";

    ctx.textBaseline =
        "alphabetic";

    ctx.font =
        "900 34px Arial";

    ctx.fillStyle =
        "#ffffff";

    ctx.fillText(
        "/1gm",
        1162,
        805
    );

    ctx.restore();



    /* =====================================================
       GOLD 24K
    ====================================================== */

    coverArea(
        738,
        912,
        414,
        101,
        "#650b06"
    );


    drawPrice(
        gold24Input.value || "____",
        930,
        962,
        "#ffe28a"
    );


    ctx.save();

    ctx.textAlign =
        "right";

    ctx.textBaseline =
        "alphabetic";

    ctx.font =
        "900 34px Arial";

    ctx.fillStyle =
        "#fff1bd";

    ctx.fillText(
        "/1gm",
        1162,
        1007
    );

    ctx.restore();



    /* =====================================================
       LPJ WATERMARK
    ====================================================== */

    ctx.save();

    ctx.globalAlpha =
        0.15;

    ctx.translate(
        960,
        1195
    );

    ctx.rotate(
        -0.16
    );

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.font =
        "900 100px Georgia";

    ctx.fillStyle =
        "#650b06";

    ctx.fillText(
        "LPJ",
        0,
        0
    );

    ctx.restore();



    /* Small LPJ branding */

    ctx.save();

    ctx.globalAlpha =
        0.9;

    ctx.textAlign =
        "right";

    ctx.font =
        "bold 16px Arial";

    ctx.fillStyle =
        "#fff0bd";

    ctx.fillText(
        "LPJ • DAILY RATE",
        1230,
        1480
    );

    ctx.restore();
}



/* =========================================================
   DOWNLOAD POSTER
========================================================= */

function downloadPoster() {

    generatePoster();

    const dateInfo =
        getDateInformation();

    const filename =
        "LPJ-" +
        dateInfo.date
            .replaceAll(" ", "-")
            .replaceAll(",", "") +
        ".png";

    const link =
        document.createElement("a");

    link.download =
        filename;

    link.href =
        canvas.toDataURL(
            "image/png"
        );

    link.click();
}



/* =========================================================
   LIVE PREVIEW
========================================================= */

dateInput.addEventListener(
    "input",
    generatePoster
);

gold22Input.addEventListener(
    "input",
    generatePoster
);

gold24Input.addEventListener(
    "input",
    generatePoster
);

silverInput.addEventListener(
    "input",
    generatePoster
);



/* =========================================================
   =========================================================
   EDITABLE DATA — EDIT ONLY THIS SECTION
   =========================================================

   Change ONLY these four values.

   The DAY is calculated automatically.

   Example:

   date   → 30 September 2026
   gold22 → 13782
   gold24 → 14980
   silver → 2300

   =========================================================
   ========================================================= */

const EDITABLE_DATA = {

    date: "30 September 2026",

    gold22: "13782",

    gold24: "14980",

    silver: "2300"

};


/* =========================================================
   LOAD EDITABLE DATA
========================================================= */

window.addEventListener(
    "load",
    function () {

        dateInput.value =
            convertDateToInput(
                EDITABLE_DATA.date
            );

        gold22Input.value =
            EDITABLE_DATA.gold22;

        gold24Input.value =
            EDITABLE_DATA.gold24;

        silverInput.value =
            EDITABLE_DATA.silver;


        /*
           Generate the poster
        */

        if (
            posterImage.complete
        ) {

            generatePoster();

        }

    }
);


/* If image finishes loading later */

posterImage.onload =
function () {

    generatePoster();

};

</script>
